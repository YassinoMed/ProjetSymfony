version: 2
updates:
  - package-ecosystem: composer
    directory: /services/core-platform
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      core-platform-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: composer
    directory: /services/ai-orchestrator
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      ai-orchestrator-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: composer
    directory: /services/generation-service
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      generation-service-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: composer
    directory: /services/sandbox-runner
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      sandbox-runner-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend/web-app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
