# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Kernel.php'

    # --- Fournisseurs IA -------------------------------------------------
    App\Provider\DeterministicProvider:
        arguments:
            $enabled: '%env(bool:AI_ALLOW_STUB)%'
        tags: ['app.ai_provider']

    App\Provider\OllamaProvider:
        arguments:
            $baseUrl: '%env(OLLAMA_URL)%'
            $model: '%env(OLLAMA_MODEL)%'
            $enabled: '%env(bool:AI_ENABLE_OLLAMA)%'
        tags: ['app.ai_provider']

    App\Provider\OpenAiCompatibleProvider:
        arguments:
            $baseUrl: '%env(AI_CLOUD_BASE_URL)%'
            $apiKey: '%env(AI_CLOUD_API_KEY)%'
            $model: '%env(AI_CLOUD_MODEL)%'
            $enabled: '%env(bool:AI_ENABLE_CLOUD)%'
        tags: ['app.ai_provider']

    App\Provider\ProviderRegistry:
        arguments:
            $providers: !tagged_iterator app.ai_provider
            $chain: '%env(AI_PROVIDER_CHAIN)%'

    # --- RAG -------------------------------------------------------------
    App\RAG\Embedding\EmbeddingProviderInterface: '@App\RAG\Embedding\EmbeddingProviderSelector'

    App\RAG\Embedding\EmbeddingProviderSelector:
        arguments:
            $selected: '%env(RAG_EMBEDDING_PROVIDER)%'

    App\RAG\Embedding\OllamaEmbeddingProvider:
        arguments:
            $baseUrl: '%env(OLLAMA_URL)%'
            $model: '%env(RAG_OLLAMA_EMBEDDING_MODEL)%'
            $enabled: '%env(bool:AI_ENABLE_OLLAMA)%'

    # --- Sécurité et messagerie -----------------------------------------
    App\Security\InternalTokenListener:
        arguments:
            $expectedToken: '%env(AI_INTERNAL_TOKEN)%'

    App\Message\RunGenerationHandler:
        arguments:
            $maxAttempts: '%env(int:AI_MAX_ATTEMPTS)%'
