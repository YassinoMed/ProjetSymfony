# En-têtes de sécurité communs aux serveurs HTTP (dev) et HTTPS.
#
# La CSP autorise les styles inline car les pages Twig embarquent leur feuille
# de style. Aucun script inline n'est autorisé : tout script doit être servi
# depuis la même origine. Une nonce CSP pourra remplacer `'unsafe-inline'`
# lorsque les styles seront externalisés.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'self'" always;
